name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e ".[dev]"
        working-directory: python
      - name: Test
        run: pytest
        working-directory: python
      - name: Test root SDK and release parity
        run: python -m pytest tests

  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install
        run: npm ci
        working-directory: typescript
      - name: Build
        run: npm run build
        working-directory: typescript
      - name: Test
        run: npm test
        working-directory: typescript
