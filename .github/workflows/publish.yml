name: Publish Packages

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish, for example v0.4.0"
        required: true
        type: string

permissions:
  contents: read

jobs:
  npm:
    name: Publish npm package
    runs-on: ubuntu-latest
    if: startsWith(github.event.release.tag_name || inputs.tag, 'v')
    permissions:
      contents: read
      id-token: write
    environment:
      name: npm
      url: https://www.npmjs.com/package/carapace-sdk
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: https://registry.npmjs.org
      - name: Verify tag matches npm version
        working-directory: typescript
        run: |
          tag="${RELEASE_TAG#v}"
          version="$(node -p "require('./package.json').version")"
          test "$version" = "$tag"
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
      - name: Install
        working-directory: typescript
        run: npm ci
      - name: Build
        working-directory: typescript
        run: npm run build
      - name: Publish
        working-directory: typescript
        run: npm publish --provenance
        env:
          NODE_AUTH_TOKEN:  ${{ secrets.NPM_TOKEN }}

  pypi:
    name: Publish PyPI package
    runs-on: ubuntu-latest
    if: startsWith(github.event.release.tag_name || inputs.tag, 'v')
    permissions:
      contents: read
      id-token: write
    environment:
      name: pypi
      url: https://pypi.org/project/carapace-sdk/
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify tag matches PyPI version
        working-directory: python
        run: |
          tag="${RELEASE_TAG#v}"
          version="$(python -c "import pathlib, tomllib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")"
          test "$version" = "$tag"
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
      - name: Build
        working-directory: python
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python/dist
