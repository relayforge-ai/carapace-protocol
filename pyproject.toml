[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "carapace-sdk"
version = "0.5.0"
description = "Portable trust envelope for AI agents — enforcement, expiry, versioning, delegation, epistemic tracking, compliance profiles, escalation workflows, catalog sync, and signed receipts"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = [
    "pydantic>=2.0",
    "cryptography>=41.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
]

[project.urls]
Homepage = "https://relayforge.tools"
Documentation = "https://relayforge.tools/docs/carapace"
Repository = "https://github.com/relayforge-ai/carapace-protocol"
Issues = "https://github.com/relayforge-ai/carapace-protocol/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["carapace*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
