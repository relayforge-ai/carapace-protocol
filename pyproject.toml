[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "carapace-sdk"
version = "0.4.0"
description = "Portable trust envelope for AI agents — enforcement, expiry, versioning, delegation, epistemic tracking, compliance profiles, and escalation workflows"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
dependencies = [
    "pydantic>=2.0",
    "cryptography>=41.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["carapace*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
